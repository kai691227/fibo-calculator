<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAIFEX API 測試</title><style>body{margin:0;background:#07101f;color:#f4f7fb;font-family:-apple-system,sans-serif}.w{max-width:700px;margin:auto;padding:28px 18px}.c{background:#111c2e;border:1px solid #26344b;border-radius:20px;padding:20px;margin:18px 0}button{width:100%;padding:16px;border:0;border-radius:15px;background:#39bdf2;font-size:18px;font-weight:800}.s{color:#9aa8bc;line-height:1.6}.ok{color:#62d98b}.bad{color:#ff7777}.wait{color:#ffd166}pre{white-space:pre-wrap;word-break:break-word;background:#08111f;padding:14px;border-radius:14px;max-height:450px;overflow:auto}</style></head><body><div class="w"><h1>🧪 TAIFEX 連線測試</h1><p class="s">測試手機瀏覽器 / GitHub Pages 能否直接讀取臺灣期貨交易所官方 OpenAPI。</p><div class="c"><button id="b">開始測試</button></div><div class="c"><h2 id="st">尚未測試</h2><p id="msg" class="s">按下「開始測試」。</p></div><div class="c"><b>回傳內容預覽</b><pre id="o">—</pre></div><p class="s">端點：TAIFEX OpenAPI /DailyMarketReportFut。這版先驗證連線，成功後再做 TX、日夜盤與上一交易時段 H/L 解析。</p></div><script>
const url='https://openapi.taifex.com.tw/v1/DailyMarketReportFut',b=document.querySelector('#b'),st=document.querySelector('#st'),msg=document.querySelector('#msg'),o=document.querySelector('#o');
b.onclick=async()=>{b.disabled=true;st.className='wait';st.textContent='⏳ 測試中…';msg.textContent='正在連線 TAIFEX OpenAPI';o.textContent='等待回應…';try{const r=await fetch(url,{cache:'no-store'}),t=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' '+r.statusText+'\n'+t.slice(0,500));let d;try{d=JSON.parse(t)}catch(e){throw Error('收到資料但不是 JSON\n'+t.slice(0,500))}st.className='ok';st.textContent='🟢 讀取成功';msg.textContent='這代表瀏覽器可以直接取得 TAIFEX 官方 OpenAPI。';o.textContent=JSON.stringify(Array.isArray(d)?d.slice(0,3):d,null,2).slice(0,12000)}catch(e){st.className='bad';st.textContent='🔴 讀取失敗';msg.textContent='把這個畫面截圖給老師，我們再判斷原因。';o.textContent=String(e)}finally{b.disabled=false}};
</script></body></html>
